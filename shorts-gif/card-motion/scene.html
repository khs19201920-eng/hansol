<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1024px;height:1536px;overflow:hidden;background:#fff}
#w{position:relative;width:1024px;height:1536px;overflow:hidden}
#base{position:absolute;inset:0;width:1024px;height:1536px}
.a{position:absolute}
.lift{position:absolute;background:url(card.png) no-repeat;background-size:1024px 1536px;will-change:transform}
.soft{-webkit-mask-image:radial-gradient(circle closest-side,#000 72%,transparent 100%)}
.ring{position:absolute;border-radius:50%;border:3px solid #8b6bff;opacity:0}
.box{position:absolute;border-radius:14px;border:3px solid #8b6bff;opacity:0;box-shadow:0 0 18px rgba(139,107,255,.7)}
#spot{position:absolute;border-radius:22px;box-shadow:0 0 0 3000px rgba(22,18,64,.40);opacity:0}
#spotEdge{position:absolute;border-radius:22px;border:3px solid rgba(255,255,255,.95);box-shadow:0 0 22px 4px rgba(139,107,255,.75),inset 0 0 18px rgba(139,107,255,.35);opacity:0}
.sweepClip{position:absolute;overflow:hidden;border-radius:20px}
.sweep{position:absolute;top:-20%;height:140%;width:140px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75) 50%,transparent);opacity:0}
.spk{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px}
#prog{position:absolute;left:43px;width:6px;border-radius:3px;background:linear-gradient(#5b7cff,#a35bff,#ff5fb5);box-shadow:0 0 10px rgba(139,107,255,.9);opacity:0}
</style></head><body><div id="w">
<img id="base" src="card.png">
<div id="prog"></div>
<div id="layer"></div>
<div id="spot"></div><div id="spotEdge"></div>
<div id="top"></div>
</div>
<script>
const L=document.getElementById('layer'), TOP=document.getElementById('top');
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), k=(t,a,d)=>cl((t-a)/d);
const oc=x=>1-Math.pow(1-x,3), io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const ob=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const bump=(t,a,d)=>{const p=k(t,a,d);return p<=0||p>=1?0:Math.sin(p*Math.PI)}; // 0→1→0
const mk=(cls,st,par=L)=>{const e=document.createElement('div');e.className=cls;Object.assign(e.style,st);par.appendChild(e);return e};
// lifted copy of a region of the original image (rect or soft circle)
function liftR(x1,y1,x2,y2,rad=12){return mk('lift',{left:x1+'px',top:y1+'px',width:(x2-x1)+'px',height:(y2-y1)+'px',backgroundPosition:`${-x1}px ${-y1}px`,borderRadius:rad+'px'})}
function liftC(cx,cy,r){const e=liftR(cx-r,cy-r,cx+r,cy+r,0);e.classList.add('soft');return e}
function ring(cx,cy,r,c){return mk('ring',{left:cx-r+'px',top:cy-r+'px',width:2*r+'px',height:2*r+'px',borderColor:c},TOP)}
function box(x1,y1,x2,y2,c,rad=14){return mk('box',{left:x1-4+'px',top:y1-4+'px',width:(x2-x1+8)+'px',height:(y2-y1+8)+'px',borderColor:c,borderRadius:rad+'px',boxShadow:`0 0 18px ${c}`},TOP)}
function sweepOn(x1,y1,x2,y2){const c=mk('sweepClip',{left:x1+'px',top:y1+'px',width:(x2-x1)+'px',height:(y2-y1)+'px'},TOP);const s=mk('sweep',{},c);s._w=x2-x1;return s}
const tf=(e,{s=1,r=0,x=0,y=0,o})=>{e.style.transform=`translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`;if(o!==undefined)e.style.opacity=o};
const shadow=(e,v,c='rgba(80,60,200,.45)')=>e.style.boxShadow=v>0.02?`0 ${6*v}px ${22*v}px ${c}`:'none';

// ---------------- animation primitives (driven by local time) ----------------
// pop: element scales up & back (with ring/box glow)
function popLift(e,lt,a,amt=.1,glow){const b=bump(lt,a,.7);const s=1+amt*(b>0?ob(Math.min(1,k(lt,a,.35)))*b/Math.max(b,.0001)*b:0);tf(e,{s:1+amt*b});shadow(e,b);if(glow){glow.style.opacity=b*.95}}
function sweepRun(s,lt,a,d=1.1){const p=k(lt,a,d);s.style.opacity=p>0&&p<1?1:0;s.style.left=(-160+(s._w+200)*io(p))+'px'}
function ringBurst(rg,lt,a,d=.7,s0=1,s1=1.8){const p=k(lt,a,d);rg.style.opacity=p>0&&p<1?(1-p):0;rg.style.transform=`scale(${s0+(s1-s0)*oc(p)})`}

// ---------------- timeline ----------------
const T_HEAD=3, STEP_D=4.5, T_S=[6.5,11,15.5,20,24.5], T_BOT=29, T_FULL=32.5, TOTAL=35.5;
window.TOTAL=TOTAL;
const RECTS={head:[38,18,1004,258],s:[[14,266,1000,432],[14,438,1000,630],[14,636,1000,852],[14,856,1000,1076],[14,1081,1000,1266]],bot:[24,1286,1004,1446]};
const CIRC_Y=[295,465,665,885,1108];
const PHASES=[[0,null],[T_HEAD,RECTS.head],...T_S.map((t,i)=>[t,RECTS.s[i]]),[T_BOT,RECTS.bot],[T_FULL,null],[TOTAL,null]];

// ---------------- build scenes ----------------
const COL=['#5b7cff','#8b5cf6','#14b8a6','#f97316','#ec4899'];
// header
const H={sweep1:sweepOn(40,80,740,205),five:liftR(428,212,548,254,10),fiveBox:box(428,212,548,254,'#a35bff',12),
 hand:sweepOn(530,25,750,125),badges:[liftR(912,22,996,85,14),liftR(912,88,996,145,14),liftR(910,150,996,212,14)],
 logo:liftC(166,35,22)};
// steps
const S=COL.map((c,i)=>({circ:liftC(46,CIRC_Y[i],34),burst:ring(46,CIRC_Y[i],30,c),sweep:sweepOn(...RECTS.s[i].map((v,j)=>j==0?66:j<2?v+6:v-6))}));
S[0].icon=liftC(120,340,52); S[0].items=[[390,322,506,409],[515,322,632,409],[640,322,757,409]].map(r=>[liftR(...r),box(...r,COL[0])]);
S[0].tip=liftR(784,300,845,334,10); S[0].note=liftC(948,316,40); S[0].tipText=sweepOn(785,340,970,415);
S[1].icon=liftC(120,515,52); S[1].items=[[400,484,522,542],[548,484,670,542],[696,484,818,542],[843,484,976,542]].map(r=>[liftR(...r),box(...r,COL[1])]);
S[1].arrows=[[534,512],[683,512],[830,512]].map(([x,y])=>liftC(x,y,14)); S[1].quotes=[[445,562,702,604],[733,562,953,604]].map(r=>[liftR(...r,14),box(...r,COL[1],16)]); S[1].qa=liftC(717,583,15); S[1].ex=liftR(390,562,433,586,6);
S[2].icon=liftC(112,712,52); S[2].items=[[398,682,564,746],[618,682,801,746]].map(r=>[liftR(...r),box(...r,COL[2])]);
S[2].tools=[[412,806],[533,806],[639,806],[779,806]].map(([x,y])=>[liftC(x,y,24),ring(x,y,20,COL[2])]); S[2].robot=liftC(926,782,62); S[2].hand=sweepOn(840,650,965,730);
S[3].icon=liftC(118,935,52); S[3].checks=[930,965,1000,1035].map(y=>[liftC(365,y,17),ring(365,y,14,COL[3]),sweepOn(380,y-16,548,y+16)]);
S[3].tools=[[614,930],[713,930],[614,1007],[713,1007]].map(([x,y])=>[liftC(x,y,30),ring(x,y,26,COL[3])]); S[3].badge=liftC(944,926,48); S[3].editor=sweepOn(783,897,972,1050);
S[4].icon=liftC(118,1150,54); S[4].lib=liftC(414,1126,24); S[4].items=[[408,1147,494,1191],[536,1147,645,1191]].map(r=>[liftR(...r,12),box(...r,COL[4])]);
S[4].arr=liftC(515,1170,15); S[4].stack=liftC(762,1168,70); S[4].hand=sweepOn(835,1095,985,1215); S[4].goal=sweepOn(392,1198,750,1250);
// bottom
const B={title:sweepOn(36,1300,330,1385),line:sweepOn(36,1388,450,1440),head:liftC(628,1366,40),arrow:liftC(964,1400,18),box:box(580,1306,996,1428,'#7a6bff',22)};
// ambient
const phonePlay=liftC(810,168,38), phoneRing=ring(810,168,32,'#ffffff');
const SPK=[[166,35,1.0,'#6d8bff'],[742,105,.8,'#7b6cff'],[962,742,1.0,'#ffcc33'],[660,712,.8,'#5b7cff'],[905,1290,.9,'#ffffff'],[1000,270,.7,'#a78bfa'],[565,30,.7,'#a78bfa'],[990,1110,.7,'#f472b6'],[380,1290,.8,'#ffffff']];
const spk=SPK.map(([x,y,s,c])=>{const e=mk('spk',{left:x+'px',top:y+'px'},TOP);e.innerHTML=`<svg viewBox="0 0 24 24" width="22" height="22"><path fill="${c}" d="M12 0l2.4 9.6L24 12l-9.6 2.4L12 24l-2.4-9.6L0 12l9.6-2.4z"/></svg>`;e._s=s;return e});

const spot=document.getElementById('spot'), edge=document.getElementById('spotEdge'), prog=document.getElementById('prog');
function setRect(e,r){e.style.left=r[0]+'px';e.style.top=r[1]+'px';e.style.width=(r[2]-r[0])+'px';e.style.height=(r[3]-r[1])+'px'}

function render(t){
 // ---- spotlight ----
 let pi=0; for(let i=0;i<PHASES.length-1;i++) if(t>=PHASES[i][0]) pi=i;
 const [ps,pr]=PHASES[pi], prev=pi>0?PHASES[pi-1][1]:null, tr=io(k(t,ps,.6));
 let rect,alpha;
 if(pr&&prev){rect=prev.map((v,j)=>v+(pr[j]-v)*tr);alpha=1}
 else if(pr){rect=pr;alpha=tr}
 else if(prev){rect=prev;alpha=1-tr}
 else alpha=0;
 spot.style.opacity=edge.style.opacity=alpha; if(rect){setRect(spot,rect);setRect(edge,rect)}

 // ---- header ----
 {const lt=t-T_HEAD; sweepRun(H.sweep1,lt,.5,1.2);
  const b=bump(lt,1.3,.9); tf(H.five,{s:1+.14*b,r:-3*Math.sin(k(lt,1.3,.9)*Math.PI*3)*b}); shadow(H.five,b); H.fiveBox.style.opacity=b;
  sweepRun(H.hand,lt,1.9,1.1);
  H.badges.forEach((e,i)=>{const bb=bump(lt,2.2+i*.3,.6);tf(e,{s:1+.1*bb});shadow(e,bb)});
 }
 // logo star twinkle always
 {const b=Math.pow(Math.max(0,Math.sin(t*2.2)),3); tf(H.logo,{s:1+.12*b,r:b*12})}

 // ---- progress line (along left timeline) ----
 let py=null; const inSteps=t>=T_S[0]&&t<T_BOT+.6;
 if(t>=T_S[0]){let y=CIRC_Y[0]; for(let i=0;i<5;i++){ if(t>=T_S[i]) y=(i==0?CIRC_Y[0]-26:CIRC_Y[i-1])+((CIRC_Y[i])-(i==0?CIRC_Y[0]-26:CIRC_Y[i-1]))*io(k(t,T_S[i],.6)); } py=y;}
 prog.style.opacity=py!==null?(t<T_BOT?1:1-k(t,T_BOT,.6)):0; if(py!==null){prog.style.top=(CIRC_Y[0]-26)+'px';prog.style.height=(py-CIRC_Y[0]+26)+'px'}

 // ---- steps ----
 S.forEach((s,i)=>{
  const lt=t-T_S[i];
  // circle pop + burst
  const cb=bump(lt,.35,.8); tf(s.circ,{s:1+.28*cb}); ringBurst(s.burst,lt,.4,.8,1,2);
  sweepRun(s.sweep,lt,.55,1.3);
  // icon: pop then gentle idle motion during the step
  const act=lt>=0&&lt<STEP_D, ip=k(lt,.6,.5);
  const idle=act&&lt>1.1?Math.sin((lt-1.1)*3.2):0;
  if(i==0){tf(s.icon,{s:1+.15*bump(lt,.6,.7)+.04*Math.abs(idle)}); s.icon.style.filter=act?`drop-shadow(0 0 ${14*(bump(lt,.6,.7)+.6*Math.abs(idle))}px rgba(255,200,40,.95))`:'none'}
  if(i==1){tf(s.icon,{s:1+.15*bump(lt,.6,.7),r:act&&lt>.6?6*Math.sin((lt-.6)*9)*Math.max(0,1-(lt-.6)/1.8):0})}
  if(i==2){tf(s.icon,{s:1+.15*bump(lt,.6,.7)+.05*Math.max(0,idle)})}
  if(i==3){const sn=act&&lt>.6?Math.max(0,Math.sin((lt-.6)*12))*Math.max(0,1-(lt-.6)/1.6):0; tf(s.icon,{s:1+.15*bump(lt,.6,.7),r:-14*sn})}
  if(i==4){const up=act&&lt>.6?Math.abs(Math.sin((lt-.6)*5))*Math.max(0,1-(lt-.6)/2.2):0; tf(s.icon,{s:1+.12*bump(lt,.6,.7)+.03*up,y:-7*up})}
  // sequential items
  (s.items||[]).forEach(([e,g],j)=>{const b=bump(lt,1.0+j*.45,.75);tf(e,{s:1+.08*b});shadow(e,b);g.style.opacity=b});
 });
 // step-specific extras
 {const lt=t-T_S[0]; const tb=bump(lt,2.5,.9); tf(S[0].tip,{s:1+.18*tb,r:8*Math.sin(k(lt,2.5,.9)*Math.PI*4)*tb}); shadow(S[0].tip,tb);
  sweepRun(S[0].tipText,lt,2.8,1.0); const nb=bump(lt,2.6,1); tf(S[0].note,{s:1+.1*nb,r:-8*Math.sin(k(lt,2.6,1)*Math.PI*3)*nb});}
 {const lt=t-T_S[1]; S[1].arrows.forEach((e,j)=>{const b=bump(lt,1.3+j*.45,.6);tf(e,{x:7*b,s:1+.15*b})});
  const eb=bump(lt,2.75,.6); tf(S[1].ex,{s:1+.15*eb});
  S[1].quotes.forEach(([e,g],j)=>{const b=bump(lt,2.95+j*.6,.9);tf(e,{s:1+.06*b});shadow(e,b);g.style.opacity=b});
  const ab=bump(lt,3.3,.6); tf(S[1].qa,{x:7*ab,s:1+.15*ab});}
 {const lt=t-T_S[2]; S[2].tools.forEach(([e,g],j)=>{const b=bump(lt,1.9+j*.35,.65);tf(e,{s:1+.2*b});ringBurst(g,lt,1.9+j*.35,.65,1,1.7)});
  const act=lt>0&&lt<STEP_D; tf(S[2].robot,{s:1.04,y:act?-6*Math.sin(lt*3):0}); if(!act)tf(S[2].robot,{s:1});
  sweepRun(S[2].hand,lt,3.3,.9);}
 {const lt=t-T_S[3]; S[3].checks.forEach(([e,g,sw],j)=>{const a=1.0+j*.4;const b=bump(lt,a,.6);tf(e,{s:1+.35*b});ringBurst(g,lt,a,.6,1,2.1);sweepRun(sw,lt,a+.1,.7)});
  S[3].tools.forEach(([e,g],j)=>{const a=2.7+j*.25;const b=bump(lt,a,.6);tf(e,{s:1+.14*b});ringBurst(g,lt,a,.6,1,1.6)});
  const bb=bump(lt,3.6,.8); tf(S[3].badge,{s:1+.12*bb,r:7*Math.sin(k(lt,3.6,.8)*Math.PI*3)*bb}); sweepRun(S[3].editor,lt,3.4,.9);}
 {const lt=t-T_S[4]; const lb=bump(lt,1.0,.6); tf(S[4].lib,{s:1+.2*lb,r:-8*lb});
  const ab=bump(lt,1.7,.6); tf(S[4].arr,{x:8*ab,s:1+.2*ab});
  // override items timing: 6편 at 1.3, 33+편 at 2.0 with bigger pop
  S[4].items.forEach(([e,g],j)=>{const b=bump(lt,1.3+j*.75,j?1.0:.7);tf(e,{s:1+(j?.16:.08)*b});shadow(e,b,j?'rgba(60,90,255,.55)':undefined);g.style.opacity=b});
  sweepRun(S[4].goal,lt,2.7,1.0); const sb=bump(lt,2.9,1); tf(S[4].stack,{s:1+.07*sb}); sweepRun(S[4].hand,lt,3.4,.9);}
 // ---- bottom ----
 {const lt=t-T_BOT; sweepRun(B.title,lt,.6,1.1); sweepRun(B.line,lt,1.2,1.1);
  const hb=bump(lt,1.6,.9); tf(B.head,{s:1+.14*hb,r:10*Math.sin(k(lt,1.6,.9)*Math.PI*3)*hb}); B.box.style.opacity=bump(lt,1.5,1.4)*.9;
  const ar=lt>1.8&&lt<3.2?Math.abs(Math.sin((lt-1.8)*7)):0; tf(B.arrow,{x:8*ar,s:1+.1*ar});}

 // ---- ambient ----
 {const ph=(t%1.6)/1.6; tf(phonePlay,{s:1+.07*Math.sin(ph*Math.PI)}); phoneRing.style.opacity=(1-ph)*.8; phoneRing.style.transform=`scale(${1+ph*.9})`;}
 const tq=Math.floor(t*6)/6;
 spk.forEach((e,i)=>{const ph=((tq*.8+i*.29)%1.4)/1.4;const v=Math.max(0,Math.sin(ph*Math.PI));e.style.opacity=v*.95;e.style.transform=`scale(${(.3+.8*v)*e._s}) rotate(${tq*50+i*20}deg)`});
}
window.render=render; render(0);
</script></body></html>
