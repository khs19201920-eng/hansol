<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML → PPTX 변환 에이전트</title>

<!-- ============ 외부 라이브러리 (CDN) ============ -->
<!-- html2canvas: 슬라이드 DOM을 고해상도 이미지로 캡처 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<!-- PptxGenJS: 이미지를 슬라이드에 넣어 .pptx 파일 생성/다운로드 -->
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

<style>
    :root {
        --primary: #830051;
        --primary-light: #6B21A8;
        --accent: #D946EF;
        --bg: #f4f5f9;
        --card-bg: #ffffff;
        --text: #1a1a2e;
        --text-sub: #6b6b85;
        --border: #e4e4ef;
        --ok: #16a34a;
        --err: #dc2626;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        min-height: 100vh;
        padding: 32px 16px;
    }
    .wrap { max-width: 960px; margin: 0 auto; }

    /* ===== 헤더 ===== */
    header { text-align: center; margin-bottom: 28px; }
    header h1 {
        font-size: 26px; font-weight: 900;
        background: linear-gradient(90deg, var(--primary), var(--primary-light), var(--accent));
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    header p { color: var(--text-sub); font-size: 14px; margin-top: 6px; }

    /* ===== 드롭존 ===== */
    .dropzone {
        background: var(--card-bg);
        border: 2.5px dashed var(--border);
        border-radius: 16px;
        padding: 48px 24px;
        text-align: center;
        cursor: pointer;
        transition: all .2s ease;
    }
    .dropzone:hover { border-color: var(--primary-light); background: #fbfaff; }
    .dropzone.dragover {
        border-color: var(--primary);
        background: #fdf2f9;
        transform: scale(1.01);
    }
    .dropzone .icon { font-size: 46px; margin-bottom: 12px; }
    .dropzone h2 { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
    .dropzone p { color: var(--text-sub); font-size: 13px; }
    .dropzone .btn {
        display: inline-block; margin-top: 16px;
        padding: 10px 24px; border-radius: 40px;
        background: var(--primary); color: #fff;
        font-size: 14px; font-weight: 600;
    }
    #fileInput { display: none; }

    /* ===== 파일 목록 ===== */
    .files { margin-top: 24px; display: flex; flex-direction: column; gap: 16px; }
    .file-card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px 20px;
        box-shadow: 0 2px 12px rgba(0,0,0,.04);
    }
    .file-card .head {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; flex-wrap: wrap;
    }
    .file-card .name { font-weight: 700; font-size: 15px; word-break: break-all; }
    .file-card .meta { font-size: 12px; color: var(--text-sub); }
    .badge {
        font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px;
        background: #f0eef6; color: var(--primary-light);
    }
    .badge.done { background: #e7f7ee; color: var(--ok); }
    .badge.error { background: #fdeaea; color: var(--err); }

    /* 썸네일 미리보기 그리드 */
    .thumbs {
        margin-top: 14px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
    }
    .thumb {
        border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
        background: #fafafa; position: relative;
    }
    .thumb img { width: 100%; display: block; }
    .thumb .n {
        position: absolute; top: 4px; left: 4px;
        font-size: 10px; font-weight: 700; color: #fff;
        background: rgba(131,0,81,.85); border-radius: 4px; padding: 1px 6px;
    }

    /* 진행바 */
    .progress-wrap { margin-top: 14px; display: none; }
    .progress-wrap.show { display: block; }
    .progress-label { font-size: 12px; color: var(--text-sub); margin-bottom: 6px; }
    .progress-bar { height: 8px; background: #eee; border-radius: 8px; overflow: hidden; }
    .progress-fill {
        height: 100%; width: 0%;
        background: linear-gradient(90deg, var(--primary), var(--accent));
        transition: width .25s ease;
    }

    /* 액션 버튼 */
    .actions { margin-top: 20px; display: flex; gap: 12px; flex-wrap: wrap; }
    button.action {
        padding: 12px 26px; border: none; border-radius: 40px;
        font-size: 14px; font-weight: 700; cursor: pointer;
        color: #fff; background: var(--primary);
        transition: opacity .2s, transform .1s;
    }
    button.action:hover:not(:disabled) { transform: translateY(-1px); }
    button.action:disabled { opacity: .45; cursor: not-allowed; }
    button.action.ghost { background: #fff; color: var(--primary); border: 1.5px solid var(--primary); }

    .hint { font-size: 12px; color: var(--text-sub); margin-top: 18px; text-align: center; }

    /* 오프스크린 렌더 영역 (화면 밖에 위치) */
    #renderStage {
        position: fixed; left: -99999px; top: 0;
        width: 1200px; background: #fff;
    }
</style>
</head>
<body>
<div class="wrap">
    <header>
        <h1>HTML → PPTX 변환 에이전트</h1>
        <p>슬라이드형 HTML을 드래그앤드롭하면 디자인 그대로 PowerPoint(.pptx)로 변환합니다</p>
    </header>

    <!-- 드롭존 -->
    <div class="dropzone" id="dropzone">
        <div class="icon">📄➜📊</div>
        <h2>HTML 파일을 여기에 드래그앤드롭</h2>
        <p>여러 파일을 한 번에 올리면 각각 별도의 PPT로 변환됩니다</p>
        <span class="btn">파일 선택</span>
        <input type="file" id="fileInput" accept=".html,.htm" multiple>
    </div>

    <!-- 파일 카드 목록 -->
    <div class="files" id="files"></div>

    <p class="hint">
        · <b>.slide</b> 클래스로 구성된 슬라이드를 인식합니다 · 16:9 와이드(13.33×7.5인치)로 출력 ·
        이미지 위에 검색 가능한 숨김 텍스트 층을 포함합니다
    </p>

    <!-- 슬라이드를 실제 크기로 렌더링해 캡처하는 화면 밖 영역 -->
    <div id="renderStage"></div>
</div>

<script>
/* =========================================================================
   HTML → PPTX 변환 에이전트
   방식: 각 .slide 를 html2canvas 로 캡처(디자인 100% 재현) →
        PptxGenJS 16:9 슬라이드에 이미지로 삽입 → 검색용 숨김 텍스트 층 추가
   ========================================================================= */

// 원본 슬라이드 픽셀 크기 (이 템플릿 기준: 1200 x 675 = 16:9)
const SLIDE_W_PX = 1200;
const SLIDE_H_PX = 675;
// PPT 슬라이드 크기 (인치) — 16:9 와이드
const PPT_W_IN = 13.333;
const PPT_H_IN = 7.5;
// 캡처 배율 (선명도) — 2배면 충분히 선명하며 파일 크기도 적정
const CAPTURE_SCALE = 2;

const dropzone  = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const filesEl   = document.getElementById('files');
const stage     = document.getElementById('renderStage');

// 업로드된 파일별 상태 저장소
let jobs = []; // { file, name, id, slides:[{img,w,h,texts:[]}], status }

/* ---------- 드래그앤드롭 & 파일선택 이벤트 ---------- */
dropzone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

['dragenter','dragover'].forEach(ev =>
    dropzone.addEventListener(ev, (e) => { e.preventDefault(); dropzone.classList.add('dragover'); })
);
['dragleave','drop'].forEach(ev =>
    dropzone.addEventListener(ev, (e) => { e.preventDefault(); dropzone.classList.remove('dragover'); })
);
dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    handleFiles(e.dataTransfer.files);
});
// 창 전체에 실수로 드롭했을 때 브라우저가 파일을 여는 것 방지
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());

/* ---------- 파일 수신 → HTML 텍스트 읽기 ---------- */
async function handleFiles(fileList) {
    const htmlFiles = Array.from(fileList).filter(f => /\.html?$/i.test(f.name));
    if (!htmlFiles.length) {
        alert('HTML 파일(.html / .htm)만 업로드할 수 있습니다.');
        return;
    }
    for (const file of htmlFiles) {
        const id = 'job_' + Math.random().toString(36).slice(2, 9);
        const job = { file, name: file.name.replace(/\.html?$/i, ''), id, slides: [], status: 'preview' };
        jobs.push(job);
        renderJobCard(job);
        try {
            const html = await file.text();
            await buildPreview(job, html);   // 슬라이드 감지 + 썸네일 캡처
        } catch (err) {
            console.error(err);
            job.status = 'error';
            job.error = err.message || '파일을 읽는 중 오류가 발생했습니다.';
            renderJobCard(job);
        }
    }
}

/* ---------- HTML → 슬라이드 감지 & 미리보기 캡처 ---------- */
async function buildPreview(job, html) {
    updateStatus(job, '슬라이드 분석 중…');

    // 1) HTML 파싱: <style> 과 .slide 요소 추출
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');
    const slideNodes = Array.from(doc.querySelectorAll('.slide'));

    if (!slideNodes.length) {
        job.status = 'error';
        job.error = 'HTML 안에서 .slide 요소를 찾지 못했습니다. (.slide 클래스 기반 슬라이드 전용 변환기입니다)';
        renderJobCard(job);
        return;
    }

    // 원본의 모든 <style> 을 모아 렌더 무대에 함께 주입 (서식 100% 재현)
    const styleHtml = Array.from(doc.querySelectorAll('style'))
        .map(s => s.outerHTML).join('\n');
    // 원본 <head> 의 폰트 <link> 도 반영
    const linkHtml = Array.from(doc.querySelectorAll('link[rel="stylesheet"], link[rel="preconnect"]'))
        .map(l => l.outerHTML).join('\n');

    job.slideNodes = slideNodes;
    job.styleHtml  = styleHtml;
    job.linkHtml   = linkHtml;

    // 2) 각 슬라이드를 실제 크기로 렌더 → html2canvas 캡처
    job.slides = [];
    for (let i = 0; i < slideNodes.length; i++) {
        updateStatus(job, `슬라이드 캡처 중… (${i + 1}/${slideNodes.length})`);
        const captured = await captureSlide(slideNodes[i], styleHtml, linkHtml);
        job.slides.push(captured);
    }

    job.status = 'ready';
    renderJobCard(job);
}

/* ---------- 단일 슬라이드 캡처 ---------- */
async function captureSlide(slideNode, styleHtml, linkHtml) {
    // 슬라이드 하나만 담은 임시 컨테이너를 화면 밖 무대에 놓는다
    const holder = document.createElement('div');
    holder.style.width  = SLIDE_W_PX + 'px';
    holder.style.background = '#fff';
    holder.innerHTML = linkHtml + styleHtml;

    // 슬라이드 노드를 복제해 넣고, 미리보기 편차를 줄이기 위해 마진 제거
    const clone = slideNode.cloneNode(true);
    clone.style.margin = '0';
    holder.appendChild(clone);
    stage.innerHTML = '';
    stage.appendChild(holder);

    // 웹폰트/이미지 로드 완료를 기다려야 서식이 깨지지 않음
    await waitForAssets(holder);

    const target = holder.querySelector('.slide') || holder;
    const rect = target.getBoundingClientRect();
    const canvas = await html2canvas(target, {
        scale: CAPTURE_SCALE,
        useCORS: true,
        allowTaint: false,
        backgroundColor: '#ffffff',
        width: Math.ceil(rect.width),
        height: Math.ceil(rect.height),
        windowWidth: SLIDE_W_PX
    });

    // 검색용 숨김 텍스트 층에 넣을 텍스트 블록들을 위치와 함께 수집
    const texts = extractTexts(target, rect);

    stage.innerHTML = '';
    return {
        img: canvas.toDataURL('image/png'),
        w: rect.width,
        h: rect.height,
        texts
    };
}

/* ---------- 웹폰트 & 이미지 로딩 대기 ---------- */
// 지정 시간 안에 resolve되지 않으면 그냥 통과시키는 타임아웃 래퍼
// (오프라인/차단 환경에서 폰트·이미지 요청이 멈춰도 변환이 멈추지 않도록 방어)
function withTimeout(promise, ms) {
    return Promise.race([
        promise,
        new Promise(res => setTimeout(res, ms))
    ]);
}
async function waitForAssets(root) {
    // 폰트 로딩 완료 대기 (최대 4초 — 못 불러와도 진행)
    if (document.fonts && document.fonts.ready) {
        try { await withTimeout(document.fonts.ready, 4000); } catch (e) {}
    }
    // 내부 <img> 로딩 대기 (이미지당 최대 4초)
    const imgs = Array.from(root.querySelectorAll('img'));
    await Promise.all(imgs.map(img => {
        if (img.complete) return Promise.resolve();
        return withTimeout(new Promise(res => { img.onload = img.onerror = res; }), 4000);
    }));
    // 레이아웃/폰트 적용을 위한 짧은 프레임 대기
    await new Promise(res => requestAnimationFrame(() => requestAnimationFrame(res)));
}

/* ---------- 텍스트 블록 + 상대 위치 추출 (숨김 텍스트 층용) ---------- */
function extractTexts(slideEl, slideRect) {
    const blocks = [];
    // 텍스트를 직접 담고 있는 리프 성격의 요소만 수집
    const candidates = slideEl.querySelectorAll('h1,h2,h3,h4,h5,h6,p,li,td,th,span,div');
    candidates.forEach(el => {
        // 자식 요소 없이 자기 텍스트만 가진 노드 위주로 (중복 방지)
        const own = Array.from(el.childNodes)
            .filter(n => n.nodeType === Node.TEXT_NODE)
            .map(n => n.textContent.trim())
            .join(' ')
            .trim();
        if (!own) return;
        const r = el.getBoundingClientRect();
        if (r.width < 2 || r.height < 2) return;
        blocks.push({
            text: own,
            // 슬라이드 기준 상대 비율 (0~1)
            x: (r.left - slideRect.left) / slideRect.width,
            y: (r.top  - slideRect.top)  / slideRect.height,
            w: r.width  / slideRect.width,
            h: r.height / slideRect.height
        });
    });
    return blocks;
}

/* ---------- PPTX 생성 ---------- */
async function convertJob(job) {
    if (!job.slides || !job.slides.length) return;
    job.status = 'converting';
    showProgress(job, 0);

    const pptx = new PptxGenJS();
    // 16:9 와이드 레이아웃 정의
    pptx.defineLayout({ name: 'WIDE_16x9', width: PPT_W_IN, height: PPT_H_IN });
    pptx.layout = 'WIDE_16x9';

    for (let i = 0; i < job.slides.length; i++) {
        const s = job.slides[i];
        const slide = pptx.addSlide();

        // 1) 배경 이미지: 슬라이드에 여백 없이 꽉 차게 배치 (디자인 100% 재현)
        slide.addImage({
            data: s.img,
            x: 0, y: 0, w: PPT_W_IN, h: PPT_H_IN
        });

        // 2) 숨김 텍스트 층: 검색/복사 가능하도록 투명 텍스트박스를 이미지 위에 얹음
        (s.texts || []).forEach(t => {
            slide.addText(t.text, {
                x: t.x * PPT_W_IN,
                y: t.y * PPT_H_IN,
                w: Math.max(t.w * PPT_W_IN, 0.3),
                h: Math.max(t.h * PPT_H_IN, 0.15),
                fontSize: 8,
                color: 'FFFFFF',
                transparency: 100,   // 완전 투명 (보이지 않음)
                align: 'left',
                valign: 'top',
                margin: 0,
                fill: { type: 'none' },
                line: { type: 'none' }
            });
        });

        showProgress(job, Math.round(((i + 1) / job.slides.length) * 100));
        // UI 갱신 여유
        await new Promise(res => setTimeout(res, 0));
    }

    // 3) 파일 다운로드 (원본 HTML명 기반)
    await pptx.writeFile({ fileName: `${job.name}.pptx` });

    job.status = 'done';
    hideProgress(job);
    renderJobCard(job);
}

/* =========================================================================
   UI 렌더링
   ========================================================================= */
function renderJobCard(job) {
    let card = document.getElementById(job.id);
    if (!card) {
        card = document.createElement('div');
        card.className = 'file-card';
        card.id = job.id;
        filesEl.appendChild(card);
    }

    const statusBadge = {
        preview:    `<span class="badge">분석 중</span>`,
        ready:      `<span class="badge">변환 준비 완료</span>`,
        converting: `<span class="badge">변환 중</span>`,
        done:       `<span class="badge done">✓ 다운로드 완료</span>`,
        error:      `<span class="badge error">오류</span>`
    }[job.status] || '';

    const slideCount = job.slides ? job.slides.length : 0;
    const meta = job.status === 'error'
        ? `<span class="meta" style="color:var(--err)">${escapeHtml(job.error || '알 수 없는 오류')}</span>`
        : `<span class="meta">슬라이드 ${slideCount}장 · ${escapeHtml(job.file.name)}</span>`;

    // 썸네일
    let thumbs = '';
    if (job.slides && job.slides.length) {
        thumbs = `<div class="thumbs">` + job.slides.map((s, i) =>
            `<div class="thumb"><span class="n">${i + 1}</span><img src="${s.img}" alt="slide ${i+1}"></div>`
        ).join('') + `</div>`;
    }

    // 액션 버튼
    let actions = '';
    if (job.status === 'ready' || job.status === 'done') {
        actions = `<div class="actions">
            <button class="action" data-convert="${job.id}">
                ${job.status === 'done' ? '다시 다운로드' : 'PPT로 변환 · 다운로드'}
            </button>
            <button class="action ghost" data-remove="${job.id}">제거</button>
        </div>`;
    }

    card.innerHTML = `
        <div class="head">
            <div>
                <div class="name">${escapeHtml(job.name)}.pptx</div>
                ${meta}
            </div>
            ${statusBadge}
        </div>
        ${thumbs}
        <div class="progress-wrap" id="${job.id}_prog">
            <div class="progress-label" id="${job.id}_plabel">변환 중…</div>
            <div class="progress-bar"><div class="progress-fill" id="${job.id}_pfill"></div></div>
        </div>
        ${actions}
    `;

    // 버튼 이벤트 바인딩
    const convBtn = card.querySelector(`[data-convert="${job.id}"]`);
    if (convBtn) convBtn.addEventListener('click', () => convertJob(job));
    const rmBtn = card.querySelector(`[data-remove="${job.id}"]`);
    if (rmBtn) rmBtn.addEventListener('click', () => {
        jobs = jobs.filter(j => j.id !== job.id);
        card.remove();
    });
}

function updateStatus(job, label) {
    const card = document.getElementById(job.id);
    if (!card) return;
    const metaEl = card.querySelector('.meta');
    if (metaEl) metaEl.textContent = label;
}

function showProgress(job, pct) {
    const wrap  = document.getElementById(job.id + '_prog');
    const fill  = document.getElementById(job.id + '_pfill');
    const label = document.getElementById(job.id + '_plabel');
    if (wrap) wrap.classList.add('show');
    if (fill) fill.style.width = pct + '%';
    if (label) label.textContent = `변환 중… ${pct}%`;
    renderProgressBadge(job);
}
function hideProgress(job) {
    const wrap = document.getElementById(job.id + '_prog');
    if (wrap) wrap.classList.remove('show');
}
function renderProgressBadge(job) {
    const card = document.getElementById(job.id);
    if (!card) return;
    const badge = card.querySelector('.badge');
    if (badge) { badge.textContent = '변환 중'; badge.className = 'badge'; }
}

function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[m]));
}
</script>
</body>
</html>
