<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML → PPTX 변환 에이전트</title>

<!-- ============ 외부 라이브러리 (CDN) ============ -->
<!-- html2canvas: 슬라이드 DOM을 고해상도 이미지로 캡처 (이미지 모드 + 썸네일용) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<!-- PptxGenJS: 도형/텍스트/표/이미지로 .pptx 파일 생성/다운로드 -->
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

<style>
    :root {
        --primary: #830051;
        --primary-light: #6B21A8;
        --accent: #D946EF;
        --bg: #f4f5f9;
        --card-bg: #ffffff;
        --text: #1a1a2e;
        --text-sub: #6b6b85;
        --border: #e4e4ef;
        --ok: #16a34a;
        --err: #dc2626;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        min-height: 100vh;
        padding: 32px 16px;
    }
    .wrap { max-width: 960px; margin: 0 auto; }

    /* ===== 헤더 ===== */
    header { text-align: center; margin-bottom: 22px; }
    header h1 {
        font-size: 26px; font-weight: 900;
        background: linear-gradient(90deg, var(--primary), var(--primary-light), var(--accent));
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    header p { color: var(--text-sub); font-size: 14px; margin-top: 6px; }

    /* ===== 모드 토글 ===== */
    .mode-bar {
        display: flex; justify-content: center; gap: 8px;
        margin-bottom: 22px;
    }
    .mode-opt {
        border: 1.5px solid var(--border); background: #fff;
        border-radius: 40px; padding: 10px 18px; cursor: pointer;
        font-size: 13px; font-weight: 600; color: var(--text-sub);
        display: flex; align-items: center; gap: 8px; transition: all .15s;
        text-align: left;
    }
    .mode-opt small { display: block; font-weight: 400; font-size: 11px; opacity: .8; }
    .mode-opt input { accent-color: var(--primary); }
    .mode-opt.active { border-color: var(--primary); color: var(--primary); background: #fdf2f9; }

    /* ===== 드롭존 ===== */
    .dropzone {
        background: var(--card-bg);
        border: 2.5px dashed var(--border);
        border-radius: 16px;
        padding: 42px 24px;
        text-align: center;
        cursor: pointer;
        transition: all .2s ease;
    }
    .dropzone:hover { border-color: var(--primary-light); background: #fbfaff; }
    .dropzone.dragover {
        border-color: var(--primary);
        background: #fdf2f9;
        transform: scale(1.01);
    }
    .dropzone .icon { font-size: 42px; margin-bottom: 10px; }
    .dropzone h2 { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
    .dropzone p { color: var(--text-sub); font-size: 13px; }
    .dropzone .btn {
        display: inline-block; margin-top: 16px;
        padding: 10px 24px; border-radius: 40px;
        background: var(--primary); color: #fff;
        font-size: 14px; font-weight: 600;
    }
    #fileInput { display: none; }

    /* ===== 파일 목록 ===== */
    .files { margin-top: 24px; display: flex; flex-direction: column; gap: 16px; }
    .file-card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px 20px;
        box-shadow: 0 2px 12px rgba(0,0,0,.04);
    }
    .file-card .head {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; flex-wrap: wrap;
    }
    .file-card .name { font-weight: 700; font-size: 15px; word-break: break-all; }
    .file-card .meta { font-size: 12px; color: var(--text-sub); }
    .badge {
        font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px;
        background: #f0eef6; color: var(--primary-light);
    }
    .badge.done { background: #e7f7ee; color: var(--ok); }
    .badge.error { background: #fdeaea; color: var(--err); }

    /* 썸네일 미리보기 그리드 */
    .thumbs {
        margin-top: 14px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
    }
    .thumb {
        border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
        background: #fafafa; position: relative;
    }
    .thumb img { width: 100%; display: block; }
    .thumb .n {
        position: absolute; top: 4px; left: 4px;
        font-size: 10px; font-weight: 700; color: #fff;
        background: rgba(131,0,81,.85); border-radius: 4px; padding: 1px 6px;
    }

    /* 진행바 */
    .progress-wrap { margin-top: 14px; display: none; }
    .progress-wrap.show { display: block; }
    .progress-label { font-size: 12px; color: var(--text-sub); margin-bottom: 6px; }
    .progress-bar { height: 8px; background: #eee; border-radius: 8px; overflow: hidden; }
    .progress-fill {
        height: 100%; width: 0%;
        background: linear-gradient(90deg, var(--primary), var(--accent));
        transition: width .25s ease;
    }

    /* 액션 버튼 */
    .actions { margin-top: 20px; display: flex; gap: 12px; flex-wrap: wrap; }
    button.action {
        padding: 12px 26px; border: none; border-radius: 40px;
        font-size: 14px; font-weight: 700; cursor: pointer;
        color: #fff; background: var(--primary);
        transition: opacity .2s, transform .1s;
    }
    button.action:hover:not(:disabled) { transform: translateY(-1px); }
    button.action:disabled { opacity: .45; cursor: not-allowed; }
    button.action.ghost { background: #fff; color: var(--primary); border: 1.5px solid var(--primary); }

    .hint { font-size: 12px; color: var(--text-sub); margin-top: 18px; text-align: center; }

    /* 오프스크린 렌더 영역 (화면 밖에 위치) */
    #renderStage {
        position: fixed; left: -99999px; top: 0;
        width: 1200px; background: #fff;
    }
</style>
</head>
<body>
<div class="wrap">
    <header>
        <h1>HTML → PPTX 변환 에이전트</h1>
        <p>슬라이드형 HTML을 드래그앤드롭하면 PowerPoint(.pptx)로 변환합니다</p>
    </header>

    <!-- 변환 모드 선택 -->
    <div class="mode-bar" id="modeBar">
        <label class="mode-opt active">
            <input type="radio" name="mode" value="editable" checked>
            <span>✏️ 편집 가능 모드<small>텍스트·도형·표로 변환 — PPT에서 직접 수정</small></span>
        </label>
        <label class="mode-opt">
            <input type="radio" name="mode" value="image">
            <span>🖼️ 이미지 모드<small>디자인 100% 재현 — 수정 불가</small></span>
        </label>
    </div>

    <!-- 드롭존 -->
    <div class="dropzone" id="dropzone">
        <div class="icon">📄➜📊</div>
        <h2>HTML 파일을 여기에 드래그앤드롭</h2>
        <p>여러 파일을 한 번에 올리면 각각 별도의 PPT로 변환됩니다</p>
        <span class="btn">파일 선택</span>
        <input type="file" id="fileInput" accept=".html,.htm" multiple>
    </div>

    <!-- 파일 카드 목록 -->
    <div class="files" id="files"></div>

    <p class="hint">
        · <b>.slide</b> 클래스로 구성된 슬라이드를 인식합니다 · 16:9 와이드(13.33×7.5인치)로 출력
    </p>

    <!-- 슬라이드를 실제 크기로 렌더링해 캡처/분석하는 화면 밖 영역 -->
    <div id="renderStage"></div>
</div>

<script>
/* =========================================================================
   HTML → PPTX 변환 에이전트
   두 가지 변환 모드:
     · editable : 각 DOM 요소의 위치/스타일을 읽어 PPT 도형·텍스트·표로 재구성
                  → PowerPoint에서 직접 편집 가능
     · image    : 각 슬라이드를 html2canvas 이미지로 캡처 → 디자인 100% 재현
   공통: 16:9(13.333×7.5in), 원본 HTML명 기반 다운로드, 다중 파일 일괄 처리
   ========================================================================= */

const SLIDE_W_PX = 1200;      // 이 템플릿의 슬라이드 기준 폭
const PPT_W_IN = 13.333;      // 16:9 와이드
const PPT_H_IN = 7.5;
const CAPTURE_SCALE = 2;      // 이미지 모드 캡처 배율(선명도)
const FONT_FACE = 'Noto Sans KR';

const dropzone  = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const filesEl   = document.getElementById('files');
const stage     = document.getElementById('renderStage');

let jobs = []; // { file, name, id, slides:[{img,w,h,prims,texts}], status }

/* ---------- 모드 토글 UI ---------- */
function currentMode() {
    const r = document.querySelector('input[name="mode"]:checked');
    return r ? r.value : 'editable';
}
document.getElementById('modeBar').addEventListener('change', () => {
    document.querySelectorAll('.mode-opt').forEach(l =>
        l.classList.toggle('active', l.querySelector('input').checked));
});

/* ---------- 드래그앤드롭 & 파일선택 ---------- */
dropzone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
['dragenter','dragover'].forEach(ev =>
    dropzone.addEventListener(ev, (e) => { e.preventDefault(); dropzone.classList.add('dragover'); }));
['dragleave','drop'].forEach(ev =>
    dropzone.addEventListener(ev, (e) => { e.preventDefault(); dropzone.classList.remove('dragover'); }));
dropzone.addEventListener('drop', (e) => { e.preventDefault(); handleFiles(e.dataTransfer.files); });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());

/* ---------- 파일 수신 ---------- */
async function handleFiles(fileList) {
    const htmlFiles = Array.from(fileList).filter(f => /\.html?$/i.test(f.name));
    if (!htmlFiles.length) { alert('HTML 파일(.html / .htm)만 업로드할 수 있습니다.'); return; }
    for (const file of htmlFiles) {
        const id = 'job_' + Math.random().toString(36).slice(2, 9);
        const job = { file, name: file.name.replace(/\.html?$/i, ''), id, slides: [], status: 'preview' };
        jobs.push(job);
        renderJobCard(job);
        try {
            const html = await file.text();
            await buildPreview(job, html);
        } catch (err) {
            console.error(err);
            job.status = 'error';
            job.error = err.message || '파일을 읽는 중 오류가 발생했습니다.';
            renderJobCard(job);
        }
    }
}

/* ---------- HTML → 슬라이드 감지 & (이미지 + 편집요소) 추출 ---------- */
async function buildPreview(job, html) {
    updateStatus(job, '슬라이드 분석 중…');
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const slideNodes = Array.from(doc.querySelectorAll('.slide'));
    if (!slideNodes.length) {
        job.status = 'error';
        job.error = 'HTML 안에서 .slide 요소를 찾지 못했습니다. (.slide 클래스 기반 슬라이드 전용 변환기입니다)';
        renderJobCard(job);
        return;
    }
    const styleHtml = Array.from(doc.querySelectorAll('style')).map(s => s.outerHTML).join('\n');
    const linkHtml  = Array.from(doc.querySelectorAll('link[rel="stylesheet"], link[rel="preconnect"]')).map(l => l.outerHTML).join('\n');

    job.slides = [];
    for (let i = 0; i < slideNodes.length; i++) {
        updateStatus(job, `슬라이드 분석 중… (${i + 1}/${slideNodes.length})`);
        const captured = await renderSlide(slideNodes[i], styleHtml, linkHtml);
        job.slides.push(captured);
    }
    job.status = 'ready';
    renderJobCard(job);
}

/* ---------- 단일 슬라이드 렌더 → 이미지 + 편집요소(prims) 동시 추출 ---------- */
async function renderSlide(slideNode, styleHtml, linkHtml) {
    const holder = document.createElement('div');
    holder.style.width = SLIDE_W_PX + 'px';
    holder.style.background = '#fff';
    holder.innerHTML = linkHtml + styleHtml;
    const clone = slideNode.cloneNode(true);
    clone.style.margin = '0';
    holder.appendChild(clone);
    stage.innerHTML = '';
    stage.appendChild(holder);

    await waitForAssets(holder);

    const target = holder.querySelector('.slide') || holder;
    const rect = target.getBoundingClientRect();

    // (A) 편집 가능 모드용: 도형/텍스트/표 프리미티브 수집
    const prims = collectNative(target, rect);
    // (B) 이미지 모드 + 썸네일용: 캡처
    const canvas = await html2canvas(target, {
        scale: CAPTURE_SCALE, useCORS: true, backgroundColor: '#ffffff',
        width: Math.ceil(rect.width), height: Math.ceil(rect.height), windowWidth: SLIDE_W_PX
    });
    // 이미지 모드용 숨김 텍스트 층 좌표
    const texts = prims.filter(p => p.kind === 'text').map(p => ({
        text: p.runs.map(r => r.text).join(''), x: p.x, y: p.y, w: p.w, h: p.h
    }));

    stage.innerHTML = '';
    return { img: canvas.toDataURL('image/png'), w: rect.width, h: rect.height, prims, texts };
}

/* ---------- 웹폰트 & 이미지 로딩 대기(타임아웃 가드) ---------- */
function withTimeout(promise, ms) {
    return Promise.race([promise, new Promise(res => setTimeout(res, ms))]);
}
async function waitForAssets(root) {
    if (document.fonts && document.fonts.ready) {
        try { await withTimeout(document.fonts.ready, 4000); } catch (e) {}
    }
    const imgs = Array.from(root.querySelectorAll('img'));
    await Promise.all(imgs.map(img => img.complete ? Promise.resolve()
        : withTimeout(new Promise(res => { img.onload = img.onerror = res; }), 4000)));
    await new Promise(res => requestAnimationFrame(() => requestAnimationFrame(res)));
}

/* =========================================================================
   편집 가능 모드: DOM → PPT 프리미티브(도형/텍스트/표) 추출
   각 요소의 getBoundingClientRect(위치) + getComputedStyle(스타일)을 읽어
   해상도 독립적인 상대좌표(0~1)와 포인트 단위 폰트로 기록한다.
   ========================================================================= */
const INLINE_TAGS = new Set(['STRONG','B','EM','I','SPAN','A','SUP','SUB','U','SMALL','MARK','ABBR','CODE','LABEL','BR']);

function collectNative(slideEl, rect) {
    const prims = [];
    const W = rect.width, H = rect.height;
    const ptPerPx = (PPT_W_IN / W) * 72;         // px 폰트 → pt
    const rx = px => (px - rect.left) / W;
    const ry = px => (px - rect.top) / H;
    const relBox = el => { const r = el.getBoundingClientRect();
        return { x: rx(r.left), y: ry(r.top), w: r.width / W, h: r.height / H, pxW: r.width, pxH: r.height }; };

    // rgb/rgba() → HEX (알파가 거의 0이면 null)
    function toHex(c) {
        if (!c) return null;
        const m = c.match(/rgba?\(([^)]+)\)/);
        if (!m) return null;
        const p = m[1].split(',').map(s => parseFloat(s.trim()));
        if (p.length >= 4 && p[3] < 0.08) return null;
        return [p[0], p[1], p[2]].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('').toUpperCase();
    }
    // 그라디언트 문자열 → 색상들의 평균(단색 근사)
    function avgGradient(str) {
        const cols = str.match(/rgba?\([^)]+\)/g);
        if (!cols) return null;
        let r = 0, g = 0, b = 0, n = 0;
        cols.forEach(c => { const h = toHex(c); if (h) { r += parseInt(h.slice(0,2),16); g += parseInt(h.slice(2,4),16); b += parseInt(h.slice(4,6),16); n++; } });
        if (!n) return null;
        return [r/n, g/n, b/n].map(v => Math.round(v).toString(16).padStart(2,'0')).join('').toUpperCase();
    }
    function fontStyleOf(cs) {
        return {
            bold: (parseInt(cs.fontWeight) >= 600 || cs.fontWeight === 'bold'),
            italic: cs.fontStyle === 'italic',
            color: toHex(cs.color) || '333333',
            size: Math.round(parseFloat(cs.fontSize) * ptPerPx * 10) / 10
        };
    }
    function stripQuotes(s) { return s.replace(/^["']|["']$/g, ''); }

    // 인라인 자식만 가진(=텍스트 리프) 요소인지
    function isTextLeaf(el) {
        return Array.from(el.children).every(c =>
            INLINE_TAGS.has(c.tagName) && getComputedStyle(c).display.startsWith('inline'));
    }

    // 텍스트 리프 → 서식 런(runs) 배열
    function runsOf(el, cs) {
        const runs = [];
        const push = (text, st) => { if (text) runs.push({ text, ...st }); };
        // ::before content (▸, ✓, 번호 등 마커) 반영
        const bef = getComputedStyle(el, '::before').content;
        if (bef && bef !== 'none' && bef !== 'normal' && /^["']/.test(bef)) push(stripQuotes(bef), fontStyleOf(cs));
        (function emit(node, pcs) {
            node.childNodes.forEach(n => {
                if (n.nodeType === 3) {
                    const t = n.textContent.replace(/\s+/g, ' ');
                    if (t.trim() || t === ' ') push(t, fontStyleOf(pcs));
                } else if (n.nodeType === 1) {
                    if (n.tagName === 'BR') { runs.push({ text: '\n' }); return; }
                    emit(n, getComputedStyle(n));
                }
            });
        })(el, cs);
        // 앞뒤 공백 런 정리
        while (runs.length && runs[0].text.trim() === '' && runs[0].text !== '\n') runs.shift();
        while (runs.length && runs[runs.length-1].text.trim() === '' && runs[runs.length-1].text !== '\n') runs.pop();
        return runs;
    }

    // 배경/테두리/모서리를 도형 프리미티브로
    function paintBox(el, cs, box) {
        const bgImg = cs.backgroundImage;
        let fill = null;
        if (bgImg && bgImg.includes('gradient')) fill = avgGradient(bgImg);
        if (!fill) fill = toHex(cs.backgroundColor);

        const br = parseFloat(cs.borderTopLeftRadius) || 0;
        const minSide = Math.min(box.pxW, box.pxH);
        let shape = 'rect', radius = 0, circle = false;
        if (br > 0) {
            if (br >= minSide / 2 - 1) { shape = 'ellipse'; circle = true; }
            else { shape = 'roundRect'; radius = (br / W) * PPT_W_IN; }
        }

        const btw = parseFloat(cs.borderTopWidth) || 0;
        const blw = parseFloat(cs.borderLeftWidth) || 0;
        let line = null;
        if (btw > 0 && toHex(cs.borderTopColor)) line = { color: toHex(cs.borderTopColor), width: Math.max(0.5, btw * ptPerPx) };

        if (fill || line || circle) {
            prims.push({ kind: 'shape', shape, ...box, fill: fill || null, line, radius });
        }
        // 왼쪽 강조선(border-left만 있는 경우: 섹션 타이틀·키메시지)
        if (blw > 0 && btw === 0) {
            const lc = toHex(cs.borderLeftColor) || '830051';
            prims.push({ kind: 'shape', shape: 'rect', x: box.x, y: box.y, w: (blw / W) * (PPT_W_IN / PPT_W_IN), h: box.h,
                pxW: blw, pxH: box.pxH, fill: lc, line: null, radius: 0 });
        }
        return circle;
    }

    // 표 → 네이티브 PPT 표 프리미티브
    function tablePrim(table, box) {
        const rows = [];
        table.querySelectorAll('tr').forEach(tr => {
            const cells = [];
            tr.querySelectorAll('th,td').forEach(td => {
                const ccs = getComputedStyle(td);
                cells.push({
                    text: td.innerText.trim(),
                    bold: (td.tagName === 'TH' || parseInt(ccs.fontWeight) >= 600),
                    color: toHex(ccs.color) || '333333',
                    fill: toHex(ccs.backgroundColor),
                    align: ccs.textAlign.includes('center') ? 'center' : (ccs.textAlign.includes('right') ? 'right' : 'left'),
                    size: Math.round(parseFloat(ccs.fontSize) * ptPerPx * 10) / 10
                });
            });
            if (cells.length) rows.push(cells);
        });
        // 첫 행 셀 폭 비율 → 열 너비 (실제 첫 tr 하나만 측정)
        const firstRow = table.querySelector('tr');
        const firstCells = firstRow ? firstRow.querySelectorAll('th, td') : [];
        const colW = Array.from(firstCells).map(c => (c.getBoundingClientRect().width / W) * PPT_W_IN);
        return { kind: 'table', ...box, rows, colW };
    }

    // DFS: 컨테이너는 재귀, 텍스트 리프/표는 종결
    function walk(el) {
        const cs = getComputedStyle(el);
        if (cs.display === 'none' || cs.visibility === 'hidden' || parseFloat(cs.opacity) === 0) return;
        const box = relBox(el);
        if (box.pxW < 1 || box.pxH < 1) return;

        const circle = paintBox(el, cs, box);

        if (el.tagName === 'TABLE') { prims.push(tablePrim(el, box)); return; }

        if (isTextLeaf(el)) {
            const runs = runsOf(el, cs);
            if (runs.some(r => r.text.trim())) {
                let align = cs.textAlign.includes('center') ? 'center' : (cs.textAlign.includes('right') ? 'right' : 'left');
                let valign = 'top';
                if (circle) { align = 'center'; valign = 'middle'; }
                prims.push({ kind: 'text', ...box, runs, align, valign,
                    size: Math.round(parseFloat(cs.fontSize) * ptPerPx * 10) / 10 });
            }
            return;
        }
        for (const c of el.children) {
            if (c.tagName === 'SCRIPT' || c.tagName === 'STYLE') continue;
            walk(c);
        }
    }

    walk(slideEl);
    // 상단 그라디언트 액센트 바 (.slide::before 재현)
    prims.unshift({ kind: 'shape', shape: 'rect', x: 0, y: 0, w: 1, h: 5 / H, pxW: W, pxH: 5,
        fill: '830051', line: null, radius: 0 });
    return prims;
}

/* =========================================================================
   PPTX 생성
   ========================================================================= */
async function convertJob(job) {
    if (!job.slides || !job.slides.length) return;
    const mode = currentMode();
    job.status = 'converting';
    showProgress(job, 0);

    const pptx = new PptxGenJS();
    pptx.defineLayout({ name: 'WIDE_16x9', width: PPT_W_IN, height: PPT_H_IN });
    pptx.layout = 'WIDE_16x9';

    for (let i = 0; i < job.slides.length; i++) {
        const s = job.slides[i];
        const slide = pptx.addSlide();
        slide.background = { color: 'FFFFFF' };

        if (mode === 'image') {
            renderImageSlide(slide, s);
        } else {
            renderEditableSlide(slide, s);
        }

        showProgress(job, Math.round(((i + 1) / job.slides.length) * 100));
        await new Promise(res => setTimeout(res, 0));
    }

    await pptx.writeFile({ fileName: `${job.name}.pptx` });
    job.status = 'done';
    hideProgress(job);
    renderJobCard(job);
}

/* 이미지 모드: 배경 이미지 + 검색용 투명 텍스트 층 */
function renderImageSlide(slide, s) {
    slide.addImage({ data: s.img, x: 0, y: 0, w: PPT_W_IN, h: PPT_H_IN });
    (s.texts || []).forEach(t => {
        if (!t.text.trim()) return;
        slide.addText(t.text, {
            x: t.x * PPT_W_IN, y: t.y * PPT_H_IN,
            w: Math.max(t.w * PPT_W_IN, 0.3), h: Math.max(t.h * PPT_H_IN, 0.15),
            fontSize: 8, color: 'FFFFFF', transparency: 100,
            align: 'left', valign: 'top', margin: 0,
            fill: { type: 'none' }, line: { type: 'none' }
        });
    });
}

/* 편집 가능 모드: 도형/텍스트/표를 네이티브로 배치 */
function renderEditableSlide(slide, s) {
    const IN_X = PPT_W_IN, IN_Y = PPT_H_IN;
    (s.prims || []).forEach(p => {
        const x = p.x * IN_X, y = p.y * IN_Y, w = p.w * IN_X, h = p.h * IN_Y;

        if (p.kind === 'shape') {
            const type = p.shape === 'ellipse' ? 'ellipse' : (p.shape === 'roundRect' ? 'roundRect' : 'rect');
            const opt = {
                x, y, w: Math.max(w, 0.02), h: Math.max(h, 0.02),
                fill: p.fill ? { color: p.fill } : { type: 'none' },
                line: p.line ? { color: p.line.color, width: p.line.width } : { type: 'none' }
            };
            if (type === 'roundRect') opt.rectRadius = Math.min(p.radius || 0.05, Math.min(w, h) / 2);
            slide.addShape(type, opt);

        } else if (p.kind === 'text') {
            const runs = [];
            p.runs.forEach(r => {
                if (r.text === '\n') { if (runs.length) runs[runs.length-1].options.breakLine = true; return; }
                if (r.text === '') return;
                runs.push({ text: r.text, options: {
                    bold: !!r.bold, italic: !!r.italic,
                    color: r.color || '333333',
                    fontSize: r.size || p.size,
                    fontFace: FONT_FACE
                }});
            });
            if (!runs.length) return;
            slide.addText(runs, {
                x, y: y - 0.02, w: Math.max(w, 0.3), h: Math.max(h, 0.18),
                align: p.align, valign: p.valign, margin: 0, wrap: true,
                fontFace: FONT_FACE, fontSize: p.size, lineSpacingMultiple: 1.0
            });

        } else if (p.kind === 'table') {
            const rows = p.rows.map(row => row.map(c => ({
                text: c.text,
                options: {
                    bold: !!c.bold, color: c.color, fontSize: Math.max(c.size, 7),
                    fill: c.fill ? { color: c.fill } : undefined,
                    align: c.align, valign: 'middle', fontFace: FONT_FACE,
                    margin: [2, 4, 2, 4]
                }
            })));
            const opt = {
                x, y, w: Math.max(w, 1),
                border: { type: 'solid', color: 'FFFFFF', pt: 1 },
                autoPage: false, valign: 'middle', fontFace: FONT_FACE
            };
            if (p.colW && p.colW.length) opt.colW = p.colW;
            slide.addTable(rows, opt);
        }
    });
}

/* =========================================================================
   UI 렌더링
   ========================================================================= */
function renderJobCard(job) {
    let card = document.getElementById(job.id);
    if (!card) { card = document.createElement('div'); card.className = 'file-card'; card.id = job.id; filesEl.appendChild(card); }

    const statusBadge = {
        preview:    `<span class="badge">분석 중</span>`,
        ready:      `<span class="badge">변환 준비 완료</span>`,
        converting: `<span class="badge">변환 중</span>`,
        done:       `<span class="badge done">✓ 다운로드 완료</span>`,
        error:      `<span class="badge error">오류</span>`
    }[job.status] || '';

    const slideCount = job.slides ? job.slides.length : 0;
    const meta = job.status === 'error'
        ? `<span class="meta" style="color:var(--err)">${escapeHtml(job.error || '알 수 없는 오류')}</span>`
        : `<span class="meta">슬라이드 ${slideCount}장 · ${escapeHtml(job.file.name)}</span>`;

    let thumbs = '';
    if (job.slides && job.slides.length) {
        thumbs = `<div class="thumbs">` + job.slides.map((s, i) =>
            `<div class="thumb"><span class="n">${i + 1}</span><img src="${s.img}" alt="slide ${i+1}"></div>`).join('') + `</div>`;
    }

    let actions = '';
    if (job.status === 'ready' || job.status === 'done') {
        actions = `<div class="actions">
            <button class="action" data-convert="${job.id}">${job.status === 'done' ? '다시 다운로드' : 'PPT로 변환 · 다운로드'}</button>
            <button class="action ghost" data-remove="${job.id}">제거</button>
        </div>`;
    }

    card.innerHTML = `
        <div class="head">
            <div><div class="name">${escapeHtml(job.name)}.pptx</div>${meta}</div>
            ${statusBadge}
        </div>
        ${thumbs}
        <div class="progress-wrap" id="${job.id}_prog">
            <div class="progress-label" id="${job.id}_plabel">변환 중…</div>
            <div class="progress-bar"><div class="progress-fill" id="${job.id}_pfill"></div></div>
        </div>
        ${actions}`;

    const convBtn = card.querySelector(`[data-convert="${job.id}"]`);
    if (convBtn) convBtn.addEventListener('click', () => convertJob(job));
    const rmBtn = card.querySelector(`[data-remove="${job.id}"]`);
    if (rmBtn) rmBtn.addEventListener('click', () => { jobs = jobs.filter(j => j.id !== job.id); card.remove(); });
}

function updateStatus(job, label) {
    const card = document.getElementById(job.id);
    if (!card) return;
    const metaEl = card.querySelector('.meta');
    if (metaEl) metaEl.textContent = label;
}
function showProgress(job, pct) {
    const wrap = document.getElementById(job.id + '_prog');
    const fill = document.getElementById(job.id + '_pfill');
    const label = document.getElementById(job.id + '_plabel');
    if (wrap) wrap.classList.add('show');
    if (fill) fill.style.width = pct + '%';
    if (label) label.textContent = `변환 중… ${pct}%`;
    const card = document.getElementById(job.id);
    const badge = card && card.querySelector('.badge');
    if (badge) { badge.textContent = '변환 중'; badge.className = 'badge'; }
}
function hideProgress(job) {
    const wrap = document.getElementById(job.id + '_prog');
    if (wrap) wrap.classList.remove('show');
}
function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
}
