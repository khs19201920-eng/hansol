<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<title>가장 공감가는 사례 투표</title>
<style>
  :root{
    --bg:#0f172a;
    --card:#1e293b;
    --card2:#273449;
    --line:#334155;
    --text:#e2e8f0;
    --muted:#94a3b8;
    --accent:#38bdf8;
    --accent2:#22d3ee;
    --gold:#fbbf24;
    --ok:#34d399;
    --danger:#f87171;
    --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    line-height:1.5;
    -webkit-text-size-adjust:100%;
  }
  body{padding:0 0 110px;}
  img{display:block;}
  button{font-family:inherit;cursor:pointer;}

  /* ---------- Header ---------- */
  header{
    position:sticky;top:0;z-index:20;
    padding:calc(env(safe-area-inset-top) + 16px) 18px 14px;
    background:linear-gradient(180deg,#0f172a 0%, rgba(15,23,42,.92) 100%);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  header h1{font-size:20px;font-weight:800;letter-spacing:-.3px;}
  header .sub{margin-top:5px;font-size:13px;color:var(--muted);}
  header .sub b{color:var(--accent);font-weight:700;}

  /* ---------- Mode banner ---------- */
  #modeBanner{
    margin:12px 14px 0;padding:10px 12px;border-radius:12px;font-size:12.5px;
    display:flex;gap:8px;align-items:flex-start;line-height:1.45;
  }
  #modeBanner.demo{background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.4);color:#fde68a;}
  #modeBanner.live{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.4);color:#a7f3d0;}
  #modeBanner .ic{font-size:14px;line-height:1.3;}

  /* ---------- Candidates ---------- */
  main{padding:14px 14px 6px;display:flex;flex-direction:column;gap:16px;}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;transition:border-color .2s, box-shadow .2s;
  }
  .card.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(56,189,248,.35);}
  .card.disabled{opacity:.55;}
  .card-head{
    display:flex;align-items:center;gap:12px;padding:14px 14px 12px;
  }
  .badge{
    width:40px;height:40px;flex:0 0 40px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:18px;color:#0f172a;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
  }
  .card-head .meta{flex:1;min-width:0;}
  .card-head .name{font-weight:700;font-size:16px;}
  .card-head .cnt{font-size:12px;color:var(--muted);margin-top:1px;}

  /* image grid */
  .grid{
    display:grid;gap:4px;padding:0 4px 4px;
    grid-template-columns:repeat(2,1fr);
  }
  .grid.one{grid-template-columns:1fr;}
  .grid.three{grid-template-columns:repeat(3,1fr);}
  .thumb{
    position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;border-radius:10px;
    background:linear-gradient(135deg,#243047,#1a2336);cursor:zoom-in;
  }
  .grid.one .thumb{aspect-ratio:4/3;}
  .thumb img{width:100%;height:100%;object-fit:cover;}
  .thumb .ph{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:6px;color:var(--muted);
    font-size:12px;text-align:center;padding:8px;
  }
  .thumb .ph .pic{font-size:26px;opacity:.7;}
  .thumb .zoomic{
    position:absolute;right:6px;bottom:6px;width:24px;height:24px;border-radius:7px;
    background:rgba(15,23,42,.7);display:flex;align-items:center;justify-content:center;
    font-size:13px;color:#fff;pointer-events:none;
  }

  /* vote toggle */
  .vote-row{padding:12px 14px 16px;}
  .vote-btn{
    width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--line);
    background:var(--card2);color:var(--text);font-size:15px;font-weight:700;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s;
  }
  .vote-btn .box{
    width:20px;height:20px;border-radius:6px;border:2px solid var(--muted);
    display:flex;align-items:center;justify-content:center;font-size:13px;color:#0f172a;
    background:transparent;transition:all .15s;
  }
  .card.selected .vote-btn{background:rgba(56,189,248,.16);border-color:var(--accent);color:#bae6fd;}
  .card.selected .vote-btn .box{background:var(--accent);border-color:var(--accent);}
  .vote-btn:disabled{cursor:not-allowed;}

  /* ---------- Footer bar ---------- */
  #bar{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);
    background:linear-gradient(180deg,rgba(15,23,42,0) 0%, #0f172a 22%);
    display:flex;gap:12px;align-items:center;
  }
  #selInfo{flex:0 0 auto;font-size:13px;color:var(--muted);min-width:74px;}
  #selInfo b{color:var(--accent);font-size:16px;}
  #submitBtn{
    flex:1;padding:15px;border:none;border-radius:14px;font-size:16px;font-weight:800;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06283d;
    transition:opacity .2s, transform .1s;
  }
  #submitBtn:active{transform:scale(.98);}
  #submitBtn:disabled{opacity:.45;}
  #resultsBtn{
    flex:0 0 auto;padding:15px 16px;border-radius:14px;font-size:14px;font-weight:700;
    background:var(--card2);color:var(--text);border:1px solid var(--line);
  }

  /* ---------- Results ---------- */
  #results{padding:6px 14px 20px;}
  #results h2{font-size:17px;font-weight:800;margin:14px 2px 4px;}
  #results .totals{font-size:13px;color:var(--muted);margin:0 2px 14px;}
  .res-row{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;margin-bottom:10px;position:relative;overflow:hidden;
  }
  .res-row.win{border-color:var(--gold);box-shadow:0 0 0 2px rgba(251,191,36,.3);}
  .res-fill{
    position:absolute;left:0;top:0;bottom:0;border-radius:14px;
    background:linear-gradient(90deg,rgba(56,189,248,.20),rgba(34,211,238,.10));
    transition:width .6s cubic-bezier(.16,1,.3,1);z-index:0;
  }
  .res-row.win .res-fill{background:linear-gradient(90deg,rgba(251,191,36,.28),rgba(251,191,36,.08));}
  .res-inner{position:relative;z-index:1;display:flex;align-items:center;gap:12px;}
  .res-badge{
    width:34px;height:34px;flex:0 0 34px;border-radius:10px;font-weight:800;
    display:flex;align-items:center;justify-content:center;color:#0f172a;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
  }
  .res-row.win .res-badge{background:linear-gradient(135deg,var(--gold),#f59e0b);}
  .res-name{flex:1;font-weight:700;}
  .res-name .crown{margin-left:6px;}
  .res-val{font-weight:800;font-size:16px;}
  .res-val small{font-weight:500;color:var(--muted);font-size:12px;margin-left:3px;}
  #votedNote{
    margin:0 2px 10px;padding:10px 12px;border-radius:12px;font-size:13px;
    background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.35);color:#a7f3d0;
  }

  /* ---------- Lightbox ---------- */
  #lightbox{
    position:fixed;inset:0;z-index:100;background:rgba(2,6,23,.97);
    display:flex;flex-direction:column;touch-action:none;
  }
  #lightbox[hidden]{display:none;}
  .lb-top{
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;color:#fff;
  }
  .lb-counter{font-size:14px;font-weight:600;color:#cbd5e1;}
  .lb-close{
    width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.12);
    color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;
  }
  .lb-stage{
    flex:1;position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  .lb-img-wrap{will-change:transform;}
  #lbImg{max-width:100vw;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;pointer-events:none;}
  .lb-ph{color:#64748b;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:14px;}
  .lb-ph .pic{font-size:54px;opacity:.6;}
  .lb-nav{
    position:absolute;top:50%;transform:translateY(-50%);
    width:46px;height:46px;border-radius:50%;border:none;
    background:rgba(255,255,255,.12);color:#fff;font-size:24px;
    display:flex;align-items:center;justify-content:center;z-index:5;
  }
  .lb-nav.prev{left:10px;} .lb-nav.next{right:10px;}
  .lb-nav:disabled{opacity:0;pointer-events:none;}
  .lb-hint{text-align:center;color:#64748b;font-size:12px;padding:8px 16px calc(env(safe-area-inset-bottom) + 14px);}

  @media (min-width:560px){
    main,#results{max-width:600px;margin-left:auto;margin-right:auto;}
    #bar{max-width:600px;left:50%;transform:translateX(-50%);}
  }
</style>
</head>
<body>

<header>
  <h1>🗳️ 가장 공감가는 사례 투표</h1>
  <div class="sub">최대 <b>3명</b>까지 선택 · 후보당 1표 · 기기당 1회 · 최다 득표 1명 선정</div>
</header>

<div id="modeBanner" class="demo"><span class="ic">⚠️</span><span id="modeText">데모 모드입니다. (이 기기에서만 집계) — 코드 상단의 Firebase 설정을 입력하면 팀원과 실시간으로 공유됩니다.</span></div>

<main id="candidates"></main>

<section id="results" hidden>
  <div id="votedNote" hidden>✅ 투표가 완료되었습니다. 이 기기에서는 재투표할 수 없습니다.</div>
  <h2>📊 실시간 결과</h2>
  <div class="totals" id="totals"></div>
  <div id="resList"></div>
</section>

<div id="bar">
  <div id="selInfo">선택 <b id="selCount">0</b>/3</div>
  <button id="resultsBtn">결과</button>
  <button id="submitBtn" disabled>투표하기</button>
</div>

<!-- Lightbox -->
<div id="lightbox" hidden>
  <div class="lb-top">
    <span class="lb-counter" id="lbCounter"></span>
    <button class="lb-close" id="lbClose" aria-label="닫기">✕</button>
  </div>
  <div class="lb-stage" id="lbStage">
    <button class="lb-nav prev" id="lbPrev" aria-label="이전">‹</button>
    <div class="lb-img-wrap" id="lbWrap">
      <img id="lbImg" alt="" />
    </div>
    <button class="lb-nav next" id="lbNext" aria-label="다음">›</button>
  </div>
  <div class="lb-hint">두 손가락으로 확대 · 더블탭 확대/축소 · 좌우로 넘기기</div>
</div>

<script type="module">
/* ============================================================
   1) 설정: 후보 & 이미지
   - 이미지는 아래 경로(images/...)에 실제 파일을 넣으면 자동 표시됩니다.
   - 파일이 없으면 자리표시(placeholder)가 보입니다.
   ============================================================ */
const CANDIDATES = [
  { id:'A', name:'A 사례', images:['images/A-1.jpg'] },
  { id:'B', name:'B 사례', images:['images/B-1.jpg','images/B-2.jpg'] },
  { id:'C', name:'C 사례', images:['images/C-1.jpg'] },
  { id:'D', name:'D 사례', images:['images/D-1.jpg','images/D-2.jpg','images/D-3.jpg'] },
  { id:'E', name:'E 사례', images:['images/E-1.jpg','images/E-2.jpg','images/E-3.jpg','images/E-4.jpg'] },
];
const MAX_VOTES = 3; // 1인당 최대 표수

/* ============================================================
   2) 공유 백엔드 (Firebase) 설정
   - Firebase 콘솔 > 프로젝트 설정 > 웹앱 config를 아래에 붙여넣고,
     Realtime Database를 만든 뒤 databaseURL을 채우세요.
   - 비워두면 자동으로 "데모 모드"(이 기기 localStorage)로 동작합니다.
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "",
  authDomain: "",
  databaseURL: "",          // 예: https://your-project-default-rtdb.firebaseio.com
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: "",
};
const VOTE_PATH = "ballots"; // RTDB 경로

/* ============================================================
   3) 저장소 추상화 (Firebase 또는 localStorage 데모)
   ============================================================ */
function makeDemoStore(){
  const KEY = "vote_ballots_demo";
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  let listeners = [];
  window.addEventListener("storage", e => { if(e.key===KEY) listeners.forEach(f=>f(read())); });
  return {
    mode:"demo",
    onBallots(cb){ listeners.push(cb); cb(read()); },
    async submit(voterId, ballot){
      const all = read(); all[voterId] = ballot;
      localStorage.setItem(KEY, JSON.stringify(all));
      listeners.forEach(f=>f(all));
    }
  };
}

async function makeFirebaseStore(){
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
  const { getDatabase, ref, onValue, set } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js");
  const app = initializeApp(FIREBASE_CONFIG);
  const db = getDatabase(app);
  return {
    mode:"live",
    onBallots(cb){
      onValue(ref(db, VOTE_PATH), snap => cb(snap.val() || {}));
    },
    async submit(voterId, ballot){
      await set(ref(db, `${VOTE_PATH}/${voterId}`), ballot);
    }
  };
}

let store;
async function initStore(){
  if(FIREBASE_CONFIG.databaseURL && FIREBASE_CONFIG.apiKey){
    try{
      store = await makeFirebaseStore();
      const b = document.getElementById("modeBanner");
      b.className = "live";
      b.querySelector(".ic").textContent = "🟢";
      document.getElementById("modeText").textContent = "실시간 공유 모드 — 팀원들의 투표가 함께 집계됩니다.";
      return;
    }catch(err){
      console.error("Firebase 연결 실패, 데모 모드로 전환:", err);
      document.getElementById("modeText").textContent =
        "Firebase 연결에 실패해 데모 모드로 동작합니다. (설정/네트워크를 확인하세요)";
    }
  }
  store = makeDemoStore();
}

/* ============================================================
   4) 상태
   ============================================================ */
const voterId = (()=>{
  let v = localStorage.getItem("voterId");
  if(!v){ v = (crypto.randomUUID ? crypto.randomUUID() : "id-"+Math.random().toString(36).slice(2)+Date.now()); localStorage.setItem("voterId", v); }
  return v;
})();
const hasVoted = () => localStorage.getItem("voted") === "1";
const selected = new Set();
let latestBallots = {};

/* ============================================================
   5) 렌더링: 후보 카드
   ============================================================ */
const candWrap = document.getElementById("candidates");

function placeholderHTML(label){
  return `<div class="ph"><div class="pic">🖼️</div><div>${label}<br><span style="opacity:.7">이미지 준비 중</span></div></div>`;
}

function buildCards(){
  candWrap.innerHTML = "";
  CANDIDATES.forEach(c=>{
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.id = c.id;

    const gridClass = c.images.length===1 ? "one" : (c.images.length%3===0 ? "three":"");
    const thumbs = c.images.map((src,i)=>`
      <div class="thumb" data-cand="${c.id}" data-idx="${i}">
        <div class="ph-host">${placeholderHTML(c.id+'-'+(i+1))}</div>
        <img src="${src}" alt="${c.name} 사진 ${i+1}"
             onload="this.previousElementSibling.style.display='none'"
             onerror="this.style.display='none'">
        <div class="zoomic">🔍</div>
      </div>`).join("");

    card.innerHTML = `
      <div class="card-head">
        <div class="badge">${c.id}</div>
        <div class="meta">
          <div class="name">${c.name}</div>
          <div class="cnt">사진 ${c.images.length}장 · 탭하면 확대</div>
        </div>
      </div>
      <div class="grid ${gridClass}">${thumbs}</div>
      <div class="vote-row">
        <button class="vote-btn" data-vote="${c.id}">
          <span class="box">✓</span><span class="lbl">이 사례에 투표</span>
        </button>
      </div>`;
    candWrap.appendChild(card);
  });
}

/* ============================================================
   6) 투표 선택 로직
   ============================================================ */
function updateSelUI(){
  document.getElementById("selCount").textContent = selected.size;
  CANDIDATES.forEach(c=>{
    const card = candWrap.querySelector(`.card[data-id="${c.id}"]`);
    const isSel = selected.has(c.id);
    card.classList.toggle("selected", isSel);
    const atMax = selected.size>=MAX_VOTES && !isSel;
    card.classList.toggle("disabled", atMax);
    const btn = card.querySelector(".vote-btn");
    btn.disabled = atMax || hasVoted();
    btn.querySelector(".lbl").textContent = isSel ? "선택됨 (취소하려면 탭)" : (atMax ? "최대 3명까지" : "이 사례에 투표");
  });
  const sub = document.getElementById("submitBtn");
  sub.disabled = hasVoted() || selected.size===0;
}

candWrap.addEventListener("click", e=>{
  const thumb = e.target.closest(".thumb");
  if(thumb){ openLightbox(thumb.dataset.cand, +thumb.dataset.idx); return; }
  const vbtn = e.target.closest(".vote-btn");
  if(vbtn && !vbtn.disabled){
    const id = vbtn.dataset.vote;
    if(selected.has(id)) selected.delete(id);
    else if(selected.size<MAX_VOTES) selected.add(id);
    updateSelUI();
  }
});

/* ============================================================
   7) 제출
   ============================================================ */
document.getElementById("submitBtn").addEventListener("click", async ()=>{
  if(hasVoted() || selected.size===0) return;
  if(!confirm(`선택하신 ${selected.size}곳에 투표합니다. 제출 후에는 이 기기에서 변경할 수 없습니다. 계속할까요?`)) return;
  const ballot = {};
  selected.forEach(id=> ballot[id]=true);
  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.textContent = "제출 중…";
  try{
    await store.submit(voterId, ballot);
    localStorage.setItem("voted","1");
    btn.textContent = "투표 완료 ✓";
    showResults(true);
  }catch(err){
    console.error(err);
    alert("제출에 실패했습니다. 네트워크를 확인하고 다시 시도해 주세요.");
    btn.disabled=false; btn.textContent="투표하기";
  }
});

document.getElementById("resultsBtn").addEventListener("click", ()=> showResults());

/* ============================================================
   8) 결과 집계 & 렌더
   ============================================================ */
function tally(ballots){
  const counts = {}; CANDIDATES.forEach(c=> counts[c.id]=0);
  let voters = 0;
  Object.values(ballots||{}).forEach(b=>{
    if(!b) return; voters++;
    Object.keys(b).forEach(id=>{ if(b[id] && counts[id]!=null) counts[id]++; });
  });
  return { counts, voters };
}

function renderResults(){
  const { counts, voters } = tally(latestBallots);
  const max = Math.max(0, ...CANDIDATES.map(c=>counts[c.id]));
  document.getElementById("totals").textContent =
    `투표자 ${voters}명 · 총 ${Object.values(counts).reduce((a,b)=>a+b,0)}표` +
    (store?.mode==="demo" ? "  (데모: 이 기기 기준)" : "");

  // 정렬: 득표 내림차순, 동률은 알파벳
  const ordered = [...CANDIDATES].sort((a,b)=> counts[b.id]-counts[a.id] || a.id.localeCompare(b.id));
  const winners = max>0 ? CANDIDATES.filter(c=>counts[c.id]===max).map(c=>c.id) : [];

  document.getElementById("resList").innerHTML = ordered.map(c=>{
    const v = counts[c.id];
    const pct = max>0 ? Math.round(v/max*100) : 0;
    const isWin = winners.length===1 && winners[0]===c.id;
    return `
      <div class="res-row ${isWin?'win':''}">
        <div class="res-fill" style="width:${pct}%"></div>
        <div class="res-inner">
          <div class="res-badge">${c.id}</div>
          <div class="res-name">${c.name}${isWin?'<span class="crown">👑</span>':''}</div>
          <div class="res-val">${v}<small>표</small></div>
        </div>
      </div>`;
  }).join("");
}

function showResults(justVoted){
  const sec = document.getElementById("results");
  sec.hidden = false;
  document.getElementById("votedNote").hidden = !(justVoted || hasVoted());
  renderResults();
  sec.scrollIntoView({behavior:"smooth", block:"start"});
}

/* ============================================================
   9) 라이트박스 (확대/핀치줌/팬/스와이프)
   ============================================================ */
const lb = document.getElementById("lightbox");
const lbImg = document.getElementById("lbImg");
const lbWrap = document.getElementById("lbWrap");
const lbCounter = document.getElementById("lbCounter");
let lbCand=null, lbIdx=0;
let scale=1, tx=0, ty=0;

function lbImages(){ return (CANDIDATES.find(c=>c.id===lbCand)||{}).images || []; }
function applyTransform(){ lbWrap.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; }
function resetTransform(){ scale=1; tx=0; ty=0; applyTransform(); }

function loadLbImage(){
  const imgs = lbImages();
  resetTransform();
  const src = imgs[lbIdx];
  lbImg.style.display="";
  // 이전 placeholder 제거
  const old = lbWrap.querySelector(".lb-ph"); if(old) old.remove();
  lbImg.src = src;
  lbImg.onerror = ()=>{
    lbImg.style.display="none";
    if(!lbWrap.querySelector(".lb-ph")){
      const ph=document.createElement("div");
      ph.className="lb-ph";
      ph.innerHTML=`<div class="pic">🖼️</div><div>${lbCand}-${lbIdx+1} · 이미지 준비 중</div>`;
      lbWrap.appendChild(ph);
    }
  };
  lbCounter.textContent = `${lbCand} · ${lbIdx+1} / ${imgs.length}`;
  document.getElementById("lbPrev").disabled = lbIdx<=0;
  document.getElementById("lbNext").disabled = lbIdx>=imgs.length-1;
}

function openLightbox(candId, idx){
  lbCand=candId; lbIdx=idx;
  lb.hidden=false;
  document.body.style.overflow="hidden";
  loadLbImage();
}
function closeLightbox(){ lb.hidden=true; document.body.style.overflow=""; }
function nav(d){
  const imgs=lbImages();
  const n=lbIdx+d;
  if(n<0||n>=imgs.length) return;
  lbIdx=n; loadLbImage();
}

document.getElementById("lbClose").addEventListener("click", closeLightbox);
document.getElementById("lbPrev").addEventListener("click", ()=>nav(-1));
document.getElementById("lbNext").addEventListener("click", ()=>nav(1));

/* 제스처: 핀치줌 + 팬 + 더블탭 + 스와이프 */
const stage = document.getElementById("lbStage");
let pointers=new Map();
let startDist=0, startScale=1, startTx=0, startTy=0, startMid={x:0,y:0};
let panStart=null, swipeStart=null, lastTap=0;

stage.addEventListener("pointerdown", e=>{
  if(e.target.closest(".lb-nav")) return;
  stage.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){
    const p=[...pointers.values()];
    startDist=Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
    startScale=scale;
    startMid={x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2};
    startTx=tx; startTy=ty;
    panStart=null; swipeStart=null;
  }else if(pointers.size===1){
    if(scale>1){ panStart={x:e.clientX-tx,y:e.clientY-ty}; }
    else { swipeStart={x:e.clientX,y:e.clientY,t:Date.now()}; }
  }
});

stage.addEventListener("pointermove", e=>{
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){
    const p=[...pointers.values()];
    const dist=Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
    scale=Math.min(5, Math.max(1, startScale * dist/startDist));
    tx=startTx + ((p[0].x+p[1].x)/2 - startMid.x);
    ty=startTy + ((p[0].y+p[1].y)/2 - startMid.y);
    applyTransform();
  }else if(pointers.size===1 && panStart && scale>1){
    tx=e.clientX-panStart.x; ty=e.clientY-panStart.y; applyTransform();
  }else if(pointers.size===1 && swipeStart && scale<=1){
    tx=e.clientX-swipeStart.x; applyTransform();
  }
});

function endPointer(e){
  if(swipeStart && scale<=1 && pointers.size===1){
    const dx=e.clientX-swipeStart.x, dt=Date.now()-swipeStart.t;
    if(Math.abs(dx)>60 || (Math.abs(dx)>30 && dt<250)){
      tx=0; applyTransform();
      nav(dx<0?1:-1);
    }else{ tx=0; applyTransform(); }
  }
  pointers.delete(e.pointerId);
  if(pointers.size<2){ startDist=0; }
  if(pointers.size===0){ panStart=null; swipeStart=null; if(scale<1.02) resetTransform(); }
}
stage.addEventListener("pointerup", endPointer);
stage.addEventListener("pointercancel", endPointer);

stage.addEventListener("click", e=>{
  if(e.target.closest(".lb-nav")) return;
  const now=Date.now();
  if(now-lastTap<300){
    if(scale>1) resetTransform();
    else { scale=2.5; applyTransform(); }
  }
  lastTap=now;
});

document.addEventListener("keydown", e=>{
  if(lb.hidden) return;
  if(e.key==="Escape") closeLightbox();
  else if(e.key==="ArrowLeft") nav(-1);
  else if(e.key==="ArrowRight") nav(1);
});

/* ============================================================
   10) 부트스트랩
   ============================================================ */
buildCards();
updateSelUI();
await initStore();
store.onBallots(b=>{ latestBallots=b||{}; if(!document.getElementById("results").hidden) renderResults(); });

if(hasVoted()){
  selected.clear();
  updateSelUI();
  document.getElementById("submitBtn").textContent="투표 완료 ✓";
  showResults(true);
}
</script>
